<!-- Trigger button — weka hii karibu na buttons zingine za store tab -->
<button class="btn btn-primary btn-sm" (click)="openModal()">
  <i class="fa fa-hand-holding-box me-1"></i> Distribute to Technician
</button>

<!-- DISTRIBUTE MODAL -->
<div class="modal fade show d-block" *ngIf="showModal" tabindex="-1" style="background:rgba(0,0,0,0.5)">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title fw-semibold mb-0">
          <i class="fa fa-hand-holding-box me-2 text-primary"></i> Distribute Vifaa kwa Fundi
        </h6>
        <button type="button" class="close" (click)="closeModal()"><span>&times;</span></button>
      </div>

      <div class="modal-body">

        <form [formGroup]="form">
          <div class="mb-3">
            <label class="form-label">Fundi <span class="text-danger">*</span></label>
            <app-searchable-select formControlName="technicianId" [options]="technicianOptions"
              placeholder="Chagua fundi..." [clearable]="false">
            </app-searchable-select>
            <div class="text-danger small mt-1" *ngIf="f['technicianId'].invalid && f['technicianId'].touched">
              Chagua fundi.
            </div>
            <div class="text-muted small mt-1" *ngIf="!loadingTechnicians && technicianOptions.length === 0">
              Hakuna fundi aliyeassigniwa kwenye project hii bado.
            </div>
          </div>
        </form>

        <div class="mb-2">
          <input type="text" class="form-control form-control-sm" placeholder="Tafuta kifaa..." [(ngModel)]="searchTerm"
            [ngModelOptions]="{standalone: true}">
        </div>

        <div *ngIf="loadingItems" class="text-center py-4">
          <div class="spinner-border text-primary spinner-border-sm"></div>
        </div>

        <table class="table table-sm" *ngIf="!loadingItems">
          <thead>
            <tr>
              <th style="width:36px"></th>
              <th>Description</th>
              <th>Unit</th>
              <th class="text-right">Kilichopo</th>
              <th style="width:110px">Kiasi</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of filteredItems">
              <td>
                <input type="checkbox" [checked]="item.selected" (change)="onToggleItem(item)">
              </td>
              <td style="font-size:13px;font-weight:500">{{item.description}}</td>
              <td style="font-size:12px;color:#6b7280">{{item.unit || '—'}}</td>
              <td class="text-right" style="font-size:13px">{{item.quantity}}</td>
              <td>
                <input type="number" class="form-control form-control-sm" [(ngModel)]="item.quantityToIssue"
                  [ngModelOptions]="{standalone: true}" [disabled]="!item.selected" [max]="item.quantity" min="1">
              </td>
            </tr>
            <tr *ngIf="filteredItems.length === 0">
              <td colspan="5" class="text-center text-muted py-4">Hakuna kifaa kilichopatikana</td>
            </tr>
          </tbody>
        </table>

        <form [formGroup]="form">
          <div class="mt-3">
            <label class="form-label">Maelezo (hiari)</label>
            <textarea class="form-control" rows="2" formControlName="notes"
              placeholder="Mfano: kwa kazi ya umeme, ghorofa ya 2"></textarea>
          </div>
        </form>
      </div>

      <div class="modal-footer">
        <button class="btn btn-light" (click)="closeModal()">Cancel</button>
        <button class="btn btn-primary" (click)="submit()" [disabled]="!canSubmit() || submitting">
          <span *ngIf="submitting" class="spinner-border spinner-border-sm me-1"></span>
          <i *ngIf="!submitting" class="fa fa-hand-holding-box me-1"></i> Toa Vifaa
        </button>
      </div>
    </div>
  </div>
</div>
